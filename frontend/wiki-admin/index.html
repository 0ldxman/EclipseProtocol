<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AETHER.WIKI — админка</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d0e0f'/%3E%3Cpath d='M8 2.5 13.5 8 8 13.5 2.5 8z' fill='none' stroke='%23e8a13c' stroke-width='1.4'/%3E%3C/svg%3E"
    />
    <style>
      /* Только раскладка: цвет, шрифт и форма приходят из общей темы, чтобы
         вики, карта и админка не разъезжались.

         Экран поделён на три вертикали — дерево, источник, результат — потому
         что в админке ровно три вопроса: где это лежит, что там написано и как
         это выглядит. Каждая вертикаль отвечает на один и не смешивается с
         соседней. Свойства записи — не четвёртая вертикаль, а вторая вкладка
         правой: смотреть на разметку и на её свойства одновременно не нужно. */

      body {
        display: grid;
        grid-template-columns: 296px minmax(0, 1fr) minmax(340px, 0.92fr);
        grid-template-rows: 44px minmax(0, 1fr);
        grid-template-areas: "head head head" "tree edit view";
        height: 100vh;
        overflow: hidden;
      }

      /* ── шапка ── */
      #head {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 14px;
        border-bottom: 1px solid var(--rule);
        background: var(--ink-2);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
      }
      .logo svg {
        display: block;
      }
      .logo b {
        font: 500 12px/1 var(--display);
        letter-spacing: 0.16em;
        color: var(--fg);
      }
      .logo b span {
        color: var(--dim);
      }
      #status {
        margin-left: auto;
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #status.is-error {
        color: var(--red);
      }

      /* ── дерево ── */
      #tree-pane {
        grid-area: tree;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--rule);
      }
      .pane-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--rule);
      }
      .pane-head .chrome {
        margin-right: auto;
      }
      #tree-filter {
        margin: 8px 10px;
        height: 25px;
      }
      #tree {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding-bottom: 12px;
      }
      #tree-foot {
        display: flex;
        gap: 12px;
        padding: 7px 10px;
        border-top: 1px solid var(--rule);
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 4px;
        cursor: pointer;
        user-select: none;
        border-left: 2px solid transparent;
        font: 11px/1.6 var(--mono);
        color: var(--fg);
      }
      .tree-row:hover {
        background: var(--ink-2);
      }
      .tree-row.is-selected {
        background: color-mix(in srgb, var(--amber) 10%, transparent);
        border-left-color: var(--amber);
      }
      .tree-row.is-selected .tree-name {
        color: var(--amber);
      }
      .tree-row.is-drop {
        background: color-mix(in srgb, var(--amber) 16%, transparent);
        border-left-color: var(--amber);
      }
      .tree-row.is-cover .tree-name {
        font-style: italic;
        color: var(--dim);
      }
      .twisty {
        width: 14px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        color: var(--dim);
        font-size: 9px;
        line-height: 1;
      }
      .tree-icon {
        color: var(--dim);
        display: flex;
        width: 12px;
      }
      .tree-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-slug {
        color: var(--dimmer);
        font-size: 10px;
      }
      .tree-access {
        color: var(--red);
        font-size: 10px;
      }
      .tree-empty {
        padding: 16px;
        color: var(--dim);
        font: 11px/1.6 var(--mono);
      }
      .tree-input {
        flex: 1;
        min-width: 0;
        height: 19px;
        padding: 0 5px;
        border: 1px solid var(--amber);
        background: var(--ink);
        color: var(--fg);
        font: 11px/1 var(--mono);
        outline: none;
      }

      /* ── источник ── */
      #edit-pane {
        grid-area: edit;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--rule);
        min-width: 0;
      }
      #record-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--rule);
      }
      #record-title {
        font: 500 13px/1.3 var(--display);
        letter-spacing: 0.06em;
        color: var(--fg);
      }
      #breadcrumb {
        color: var(--dim);
        font: 10px/1.4 var(--mono);
      }
      #record-actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      #insert-bar {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        padding: 6px 14px;
        border-bottom: 1px solid var(--rule);
        background: var(--ink-2);
      }
      #insert-bar .chrome {
        margin-right: 4px;
      }
      #editor {
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }
      #edit-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-height: 30px;
        padding: 5px 14px;
        border-top: 1px solid var(--rule);
      }
      #warnings {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #presence {
        margin-left: auto;
        color: var(--dim);
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #presence[data-state="offline"] {
        color: var(--red);
      }
      .chip.is-warn {
        color: var(--amber);
        border-color: color-mix(in srgb, var(--amber) 45%, transparent);
      }
      .chip.is-info {
        color: var(--red);
        border-color: color-mix(in srgb, var(--red) 45%, transparent);
      }
      .chip.is-warn::before,
      .chip.is-info::before,
      .chip.is-ghost::before {
        content: none;
      }

      /* ── результат: просмотр или свойства ── */
      #view-pane {
        grid-area: view;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #view-tabs {
        display: flex;
        gap: 1px;
        background: var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      #view-tabs button {
        flex: 1;
        padding: 8px 12px;
        border: 0;
        border-top: 2px solid transparent;
        background: var(--ink-2);
        color: var(--dim);
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #view-tabs button:hover {
        color: var(--fg);
      }
      #view-tabs button.on {
        background: var(--ink);
        border-top-color: var(--amber);
        color: var(--amber);
      }
      .view-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 22px;
        container-type: inline-size;
      }
      .view-body[hidden] {
        display: none;
      }
      #preview {
        max-width: none;
      }

      /* свойства */
      #props {
        padding: 0;
      }
      .prop {
        padding: 12px 18px;
        border-bottom: 1px solid var(--rule);
      }
      .prop > label,
      .prop > .chrome {
        display: block;
        margin-bottom: 7px;
      }
      .prop .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .prop .note {
        margin-top: 7px;
        font: 10px/1.5 var(--mono);
        color: var(--dimmer);
      }
      .prop input[type="text"] {
        flex: 1;
        min-width: 0;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--rule);
        background: var(--ink-2);
        color: var(--fg);
        font: 11px/1 var(--mono);
        outline: none;
      }
      .prop input[type="text"]:focus {
        border-color: var(--rule-2);
      }
      .levels {
        display: flex;
        gap: 1px;
        background: var(--rule);
      }
      .levels button {
        flex: 1;
        height: 26px;
        border: 0;
        background: var(--ink-2);
        color: var(--dim);
        font: 11px/1 var(--mono);
        cursor: pointer;
      }
      .levels button:hover {
        color: var(--fg);
      }
      .levels button.on {
        background: var(--red);
        color: var(--ink);
      }
      .levels button.on[data-level="0"] {
        background: var(--ink-3);
        color: var(--fg);
      }
      #prop-empty {
        padding: 40px 20px;
        text-align: center;
      }

      /* ── CodeMirror под общую тему ── */
      .cm-editor {
        height: 100%;
        background: var(--ink);
      }
      .cm-editor.cm-focused {
        outline: none;
      }
      .cm-gutters {
        background: var(--ink);
        border-right: 1px solid var(--rule);
        color: #43454a;
      }
      .cm-activeLineGutter {
        background: var(--ink-2);
        color: var(--dim);
      }
      .cm-activeLine {
        background: rgba(255, 255, 255, 0.025);
      }
      .cm-content {
        caret-color: var(--amber);
      }
      .cm-cursor {
        border-left-color: var(--amber);
      }
      .cm-selectionBackground,
      .cm-editor .cm-selectionBackground {
        background: color-mix(in srgb, var(--amber) 22%, transparent) !important;
      }
    </style>
  </head>
  <body>
    <div id="head">
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="none" stroke="#e8a13c" stroke-width="1.4" />
        </svg>
        <b>AETHER<span>.</span>WIKI</b>
      </div>
      <span class="chrome">админка</span>
      <a class="btn btn--ghost" id="open-site" href="../" target="_blank" rel="noopener">открыть архив</a>
      <div id="status">загрузка…</div>
    </div>

    <div id="tree-pane">
      <div class="pane-head">
        <span class="chrome">дерево</span>
        <button class="btn btn--sm" id="new-folder" type="button" title="Новая папка">+ папка</button>
        <button class="btn btn--sm" id="new-record" type="button" title="Новая запись">+ запись</button>
      </div>
      <label class="field" id="tree-filter">
        <input type="search" id="tree-filter-input" placeholder="фильтр по названию или слагу" />
      </label>
      <div id="tree"></div>
      <div id="tree-foot">
        <span class="chrome" id="tree-count"></span>
        <span class="chrome" style="margin-left: auto">dbl — переименовать</span>
      </div>
    </div>

    <div id="edit-pane">
      <div id="record-head">
        <div>
          <div id="record-title">Ничего не выбрано</div>
          <div id="breadcrumb"></div>
        </div>
        <div id="record-actions"></div>
      </div>
      <div id="insert-bar"><span class="chrome">вставить</span></div>
      <div id="editor"></div>
      <div id="edit-foot">
        <div id="warnings"></div>
        <div id="presence"></div>
      </div>
    </div>

    <div id="view-pane">
      <div id="view-tabs">
        <button type="button" class="on" data-tab="preview">просмотр</button>
        <button type="button" data-tab="props">свойства</button>
      </div>
      <div class="view-body" id="preview-body"><div id="preview" class="prose"></div></div>
      <div class="view-body" id="props" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
