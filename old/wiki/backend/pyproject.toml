[project]
name = "aether-wiki"
version = "0.1.0"
description = "Wiki service for the aether ecosystem: lore records with flexible infoboxes, org-scoped read access via aether-auth JWTs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
