<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Wiki — Карта</title>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #05070d; }
    #map { width: 100%; height: 100vh; }

    :root {
      --accent: #e8a13c;
      --accent-rgb: 232, 161, 60;
      --btn-bg: #121315;
    }

    #controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }

    #share-control {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
    }

    /* Shared button look: square corners, thin border, translucent dark
       fill; hover reveals accent-colored corner brackets + accent text;
       .active swaps border/text/fill to the accent color. */
    .ui-btn {
      position: relative;
      padding: 7px 14px;
      border-radius: 0;
      border: none;
      /* Inset box-shadow instead of border: it's drawn flush with the
         element's own edge (no padding-box offset), so it lines up exactly
         with the corner marks below, which anchor to that same edge. */
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-family: "JetBrains Mono", "Courier New", "Roboto Mono", monospace;
      font-size: 13px;
      text-transform: uppercase;
      background: rgba(18, 19, 21, 0.7);
      color: #fff;
      transition: color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    /* Corner marks at all 4 corners — one horizontal + one vertical line
       per corner, flush with the button edge, moderate length. */
    .ui-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      background:
        linear-gradient(var(--accent), var(--accent)) top left / 6px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) top left / 1px 6px no-repeat,
        linear-gradient(var(--accent), var(--accent)) top right / 6px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) top right / 1px 6px no-repeat,
        linear-gradient(var(--accent), var(--accent)) bottom left / 6px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) bottom left / 1px 6px no-repeat,
        linear-gradient(var(--accent), var(--accent)) bottom right / 6px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) bottom right / 1px 6px no-repeat;
    }
    .ui-btn:hover { color: var(--accent); }
    .ui-btn:hover::before { opacity: 1; }
    .ui-btn.active {
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      background: rgba(var(--accent-rgb), 0.18);
    }

    #search-box {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 340px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(18, 19, 21, 0.7);
    }
    .search-prompt {
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 15px;
      line-height: 1;
    }
    #search-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: #fff;
      font-family: "JetBrains Mono", "Courier New", "Roboto Mono", monospace;
      font-size: 13px;
      text-transform: uppercase;
      outline: none;
    }
    #search-input::placeholder { color: rgba(255, 255, 255, 0.45); }
    #search-results {
      margin-top: 8px;
      border: 1px solid var(--accent);
      background: rgba(18, 19, 21, 0.94);
      display: none;
    }
    #search-results .search-result {
      padding: 7px 12px;
      font-size: 13px;
      font-family: "JetBrains Mono", "Courier New", "Roboto Mono", monospace;
      text-transform: uppercase;
      color: #ddd;
      cursor: pointer;
    }
    #search-results .search-result.active,
    #search-results .search-result:hover {
      background: rgba(var(--accent-rgb), 0.18);
      color: #fff;
    }
    #search-results .search-result .separator {
      color: rgba(255, 255, 255, 0.3);
      margin: 0 8px;
    }
    #search-results .search-result .tag {
      color: rgba(var(--accent-rgb), 0.85);
    }

    #tooltip {
      position: absolute;
      background: rgba(18, 19, 21, 0.85);
      padding: 7px 12px;
      border-radius: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      pointer-events: none;
      display: none;
      z-index: 10;
      font-family: "JetBrains Mono", "Courier New", "Roboto Mono", monospace;
    }
    #tooltip .tooltip-region {
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #tooltip .tooltip-tag {
      color: rgba(var(--accent-rgb), 0.85);
      font-weight: 400;
      font-size: 11px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-top: 2px;
    }
    #tooltip .tooltip-occupied {
      color: #ff6b6b;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
      margin-top: 3px;
    }

    .country-label {
      pointer-events: none;
      font-family: "JetBrains Mono", "Courier New", "Roboto Mono", monospace;
      font-weight: 700;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 1px #000;
      white-space: nowrap;
      display: inline-block;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <button class="ui-btn mode-btn active" data-mode="country">Страны</button>
    <button class="ui-btn mode-btn" data-mode="sides">Стороны</button>
  </div>
  <div id="search-box">
    <div class="search-bar">
      <span class="search-prompt">&gt;</span>
      <input id="search-input" type="text" placeholder="Поиск страны..." autocomplete="off" />
    </div>
    <div id="search-results"></div>
  </div>
  <div id="share-control">
    <button id="copy-link-btn" class="ui-btn">Скопировать ссылку</button>
  </div>
  <div id="tooltip">
    <div class="tooltip-region"></div>
    <div class="tooltip-tag"></div>
    <div class="tooltip-occupied"></div>
  </div>

  <script>
    const base = new URL("./", window.location.href.replace(/\/?$/, "/")).href;
    const apiBase = base;

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile.bind(protocol));

    // Shareable view: the URL hash encodes #zoom/lat/lng (same convention as
    // OpenStreetMap) so a link copied from the address bar reopens the map
    // at the same spot — handy for pasting into the wiki.
    function parseHashView() {
      const m = location.hash.match(/^#([\d.]+)\/(-?[\d.]+)\/(-?[\d.]+)$/);
      if (!m) return null;
      return { zoom: parseFloat(m[1]), center: [parseFloat(m[3]), parseFloat(m[2])] };
    }
    const initialView = parseHashView();

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        projection: { type: "globe" },
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
          land: {
            type: "vector",
            url: `pmtiles://${base}geo/land.pmtiles`,
          },
          provinces: {
            type: "vector",
            url: `pmtiles://${base}geo/provinces.pmtiles`,
            promoteId: { provinces: "fid" },
          },
          "country-borders": {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          },
          "occupied-zones": {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          },
          coastline: {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          },
        },
        layers: [
          {
            id: "background",
            type: "background",
            paint: { "background-color": "#14181f" },
          },
          {
            // A thin halo offset a fixed geographic distance out from the
            // coast (computed server-side via a buffer) — makes small
            // islands easier to spot against the flat ocean background,
            // which we don't render as a real polygon. Drawn before
            // land-fill so the land itself covers the part of the ring
            // that overlaps the coast.
            id: "coastline-halo",
            type: "line",
            source: "coastline",
            paint: {
              "line-color": "#3a4250",
              "line-width": 0.8,
              "line-opacity": 0.6,
            },
          },
          {
            id: "land-fill",
            type: "fill",
            source: "land",
            "source-layer": "land",
            paint: { "fill-color": "#242831" },
          },
          {
            id: "provinces-fill",
            type: "fill",
            source: "provinces",
            "source-layer": "provinces",
            paint: {
              "fill-color": ["coalesce", ["feature-state", "color"], "rgba(0,0,0,0)"],
              "fill-opacity": 0.1,
            },
          },
          {
            id: "occupied-fill",
            type: "fill",
            source: "occupied-zones",
            paint: {
              "fill-pattern": ["get", "occupier_pattern"],
              "fill-opacity": 0.2,
            },
          },
          {
            id: "provinces-border",
            type: "line",
            source: "provinces",
            "source-layer": "provinces",
            paint: {
              "line-color": "#000",
              "line-width": 0.4,
              "line-opacity": 0.5,
            },
          },
          {
            id: "land-border",
            type: "line",
            source: "land",
            "source-layer": "land",
            paint: {
              "line-color": "#3a4250",
              "line-width": 0.8,
            },
          },
          {
            id: "country-borders-line",
            type: "line",
            source: "country-borders",
            paint: {
              "line-color": "#e19744",
              "line-width": 1.6,
              // These borders are simplified, so at high zoom they visibly
              // drift from the actual province edges — fade them out by
              // zoom 10 instead of letting that mismatch show.
              "line-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0.3, 10, 0],
            },
          },
        ],
      },
      center: initialView ? initialView.center : [20, 30],
      zoom: initialView ? initialView.zoom : 2,
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    function updateHashView() {
      const { lng, lat } = map.getCenter();
      const zoom = map.getZoom();
      history.replaceState(null, "", `#${zoom.toFixed(2)}/${lat.toFixed(4)}/${lng.toFixed(4)}`);
    }
    map.on("moveend", updateHashView);

    let currentMode = "country";
    let provinceStates = {};
    let countriesByTag = {};
    let sidesByTag = {};
    let hatchIds = new Set();
    let labelMarkers = [];
    let labelMeta = [];
    let rawOccupiedZones = { type: "FeatureCollection", features: [] };
    let countryCoords = {};
    const NEUTRAL_LABEL_COLOR = "#888888";

    function countryName(tag) {
      const c = countriesByTag[tag];
      if (!c) return tag;
      return c.current_name || c.name;
    }

    function lighten(hex, factor) {
      const [r, g, b] = hexToRgb(hex);
      const l = (v) => Math.round(v + (255 - v) * factor);
      return `rgb(${l(r)}, ${l(g)}, ${l(b)})`;
    }

    // Mirrors the backend's country_color_for_mode(): in "sides" mode a
    // country's label takes its side's color, or a lightened sympathy
    // color, or grey if it's aligned with neither.
    function labelColor(tag) {
      // Reverted: colored-by-side labels didn't read well, back to plain white.
      return "#fff";
    }

    async function loadCountries() {
      const res = await fetch(`${apiBase}api/countries`);
      const list = await res.json();
      countriesByTag = {};
      list.forEach((c) => (countriesByTag[c.tag] = c));
    }

    async function loadSides() {
      const res = await fetch(`${apiBase}api/sides`);
      const list = await res.json();
      sidesByTag = {};
      list.forEach((s) => (sidesByTag[s.tag] = s));
    }

    function hexToRgb(hex) {
      hex = hex.replace("#", "");
      return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    }

    function makeHatchPattern(color) {
      const size = 24;
      const spacing = 6;
      const thickness = 3;
      const [r, g, b] = hexToRgb(color);
      const data = new Uint8ClampedArray(size * size * 4);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          const v = (x + y) % spacing;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = v < thickness ? 230 : 0;
        }
      }
      return { width: size, height: size, data };
    }

    function ensureHatchPattern(color) {
      const id = `hatch-${color.replace("#", "")}`;
      if (!hatchIds.has(id)) {
        hatchIds.add(id);
        map.addImage(id, makeHatchPattern(color));
      }
      return id;
    }

    function applyStates() {
      for (const [fid, state] of Object.entries(provinceStates)) {
        map.setFeatureState(
          { source: "provinces", sourceLayer: "provinces", id: parseInt(fid) },
          { color: state.color }
        );
      }
      applyOccupiedOverlay();
    }

    function applyOccupiedOverlay() {
      const features = [];
      for (const feat of rawOccupiedZones.features) {
        const state = provinceStates[feat.properties.fid];
        if (!state || !state.occupier_color) continue;
        features.push({
          ...feat,
          properties: { ...feat.properties, occupier_pattern: ensureHatchPattern(state.occupier_color) },
        });
      }
      const src = map.getSource("occupied-zones");
      if (src) src.setData({ type: "FeatureCollection", features });
    }

    async function loadOccupiedZones() {
      const res = await fetch(`${apiBase}api/map/occupied-zones`);
      rawOccupiedZones = await res.json();
      applyOccupiedOverlay();
    }

    // Search points for *every* country that owns territory, including
    // ones fully annexed into another country (no border line of their
    // own). loadBordersAndLabels() also fills in countryCoords for the
    // root-level countries that do have a border; this covers the rest.
    async function loadCountryPoints() {
      const res = await fetch(`${apiBase}api/map/country-points`);
      const points = await res.json();
      Object.assign(countryCoords, points);
    }

    async function loadCoastline() {
      const res = await fetch(`${apiBase}api/map/coastline`);
      const geojson = await res.json();
      const src = map.getSource("coastline");
      if (src) src.setData(geojson);
    }

    // Google-Maps-style labels: one fixed, crisp font size for every
    // country (Google Maps doesn't size-up text for bigger countries
    // either) — no rotation, no opacity gradients while visible. But
    // *when* a label appears is continuous, not bucketed: each country
    // gets its own minZoom from a log-area curve, calibrated against this
    // dataset's real spread (Russia ~2700deg² down to Vatican ~0.00004deg²)
    // so countries reveal themselves gradually as you zoom in rather than
    // in a few synced waves.
    function pickMinZoom(area) {
      const minZoom = 4.4 - 1.3 * Math.log10(area + 1e-7);
      return Math.min(11, Math.max(0, minZoom));
    }

    // DOM markers don't know about the globe — MapLibre just projects their
    // lng/lat to a screen point regardless of which side of the sphere is
    // currently facing the camera, so on globe a label on the far side
    // still shows up (the "ghosting" effect). There's no public API for
    // "is this point on the visible hemisphere", but project() then
    // unproject() round-trips correctly only for points that are actually
    // the ones rendered at that screen pixel — for an occluded point the
    // round trip lands somewhere else entirely. We use the size of that
    // mismatch both to hide occluded labels and to fade them out smoothly
    // as they approach the horizon limb, instead of an abrupt pop.
    const GLOBE_FADE_DEGREES = 2;

    function globeVisibility(lng, lat) {
      const screen = map.project([lng, lat]);
      const back = map.unproject(screen);
      const dLng = Math.abs(((back.lng - lng + 540) % 360) - 180);
      const dLat = Math.abs(back.lat - lat);
      const dist = Math.max(dLng, dLat);
      return Math.min(1, Math.max(0, 1 - dist / GLOBE_FADE_DEGREES));
    }

    function updateLabelTransforms() {
      const zoom = map.getZoom();
      for (const m of labelMeta) {
        const zoomVisible = zoom >= m.minZoom ? 1 : 0;
        m.el.style.opacity = zoomVisible * globeVisibility(m.lng, m.lat);
      }
    }
    map.on("move", updateLabelTransforms);

    async function loadBordersAndLabels(mode) {
      const res = await fetch(`${apiBase}api/map/borders?mode=${mode}`);
      const geojson = await res.json();

      const src = map.getSource("country-borders");
      if (src) src.setData(geojson);

      labelMarkers.forEach((m) => m.remove());
      labelMarkers = [];
      labelMeta = [];
      // Not reset here: loadCountryPoints() (covering annexed countries with
      // no border line of their own) runs concurrently with this on initial
      // load and would otherwise get wiped depending on resolution order.
      for (const feat of geojson.features) {
        const { tag, label_lng, label_lat, label_minx, label_maxx, label_miny, label_maxy } = feat.properties;
        // Bounding-box area, longitude corrected for latitude (a degree of
        // longitude shrinks toward the poles).
        const area =
          Math.max(0, label_maxx - label_minx) *
          Math.cos((label_lat * Math.PI) / 180) *
          Math.max(0, label_maxy - label_miny);

        countryCoords[tag] = { lng: label_lng, lat: label_lat };

        const anchorEl = document.createElement("div");
        const inner = document.createElement("div");
        inner.className = "country-label";
        inner.textContent = countryName(tag);
        inner.style.color = labelColor(tag);
        anchorEl.appendChild(inner);
        const marker = new maplibregl.Marker({ element: anchorEl, anchor: "center" })
          .setLngLat([label_lng, label_lat])
          .addTo(map);
        labelMarkers.push(marker);
        labelMeta.push({ el: inner, lng: label_lng, lat: label_lat, minZoom: pickMinZoom(area) });
      }
      updateLabelTransforms();
    }

    async function loadStates(mode) {
      const res = await fetch(`${apiBase}api/map/states?mode=${mode}`);
      provinceStates = await res.json();
      applyStates();
    }

    map.on("load", async () => {
      await Promise.all([loadCountries(), loadSides()]);
      await Promise.all([
        loadOccupiedZones(),
        loadStates(currentMode),
        loadBordersAndLabels(currentMode),
        loadCountryPoints(),
        loadCoastline(),
      ]);
    });

    // режим переключения
    document.querySelectorAll(".mode-btn[data-mode]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn[data-mode]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        loadStates(currentMode);
        loadBordersAndLabels(currentMode);
      });
    });

    // тултип
    const tooltip = document.getElementById("tooltip");
    const tooltipRegion = tooltip.querySelector(".tooltip-region");
    const tooltipTag = tooltip.querySelector(".tooltip-tag");
    const tooltipOccupied = tooltip.querySelector(".tooltip-occupied");

    function showTooltip(props, point) {
      const fid = props.fid;
      const state = provinceStates[fid] || {};
      tooltip.style.display = "block";
      tooltip.style.left = point.x + 14 + "px";
      tooltip.style.top = point.y + 14 + "px";

      tooltipRegion.textContent = props.shapeName || fid;

      tooltipTag.textContent = state.owner_parent
        ? `//${state.owner_parent}:${state.owner}`
        : state.owner
        ? `//${state.owner}`
        : "";
      tooltipTag.style.display = tooltipTag.textContent ? "block" : "none";

      if (state.occupied_by) {
        tooltipOccupied.textContent = `[ OCCUPIED BY [${countryName(state.occupied_by).toUpperCase()}] ]`;
        tooltipOccupied.style.display = "block";
      } else {
        tooltipOccupied.style.display = "none";
      }
    }

    map.on("mousemove", "provinces-fill", (e) => {
      showTooltip(e.features[0].properties, e.point);
      map.getCanvas().style.cursor = "pointer";
    });
    map.on("mouseleave", "provinces-fill", () => {
      tooltip.style.display = "none";
      map.getCanvas().style.cursor = "";
    });

    // Touch devices have no hover, so a tap is the only way to see info —
    // show the tooltip for whatever province was tapped, hide it again if
    // the tap landed on open water/space. This also works fine alongside
    // the hover handlers above on desktop.
    map.on("click", (e) => {
      const feats = map.queryRenderedFeatures(e.point, { layers: ["provinces-fill"] });
      if (feats.length) {
        showTooltip(feats[0].properties, e.point);
      } else {
        tooltip.style.display = "none";
      }
    });

    // копировать ссылку на текущий вид
    const copyLinkBtn = document.getElementById("copy-link-btn");
    copyLinkBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = location.href;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      copyLinkBtn.textContent = "Скопировано!";
      copyLinkBtn.classList.add("active");
      setTimeout(() => {
        copyLinkBtn.textContent = "Скопировать ссылку";
        copyLinkBtn.classList.remove("active");
      }, 1500);
    });

    // поиск страны
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    let searchMatches = [];
    let searchActiveIndex = -1;

    function searchCandidates() {
      return Object.keys(countryCoords).map((tag) => ({ tag, name: countryName(tag) }));
    }

    function updateSearchActive() {
      searchResults.querySelectorAll(".search-result").forEach((el, i) => {
        el.classList.toggle("active", i === searchActiveIndex);
      });
    }

    function selectSearchResult(match) {
      const coords = countryCoords[match.tag];
      if (coords) {
        map.flyTo({ center: [coords.lng, coords.lat], zoom: Math.max(map.getZoom(), 4) });
      }
      searchInput.value = match.name;
      searchResults.style.display = "none";
      searchMatches = [];
    }

    function renderSearchResults(matches) {
      searchResults.innerHTML = "";
      searchActiveIndex = matches.length ? 0 : -1;
      matches.forEach((m, i) => {
        const row = document.createElement("div");
        row.className = "search-result" + (i === 0 ? " active" : "");
        row.innerHTML = `${m.name}<span class="separator">|</span><span class="tag">${m.tag}</span>`;
        row.addEventListener("click", () => selectSearchResult(m));
        searchResults.appendChild(row);
      });
      searchResults.style.display = matches.length ? "block" : "none";
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        searchResults.style.display = "none";
        searchMatches = [];
        return;
      }
      searchMatches = searchCandidates()
        .filter((c) => c.name.toLowerCase().includes(q) || c.tag.toLowerCase().includes(q))
        .slice(0, 8);
      renderSearchResults(searchMatches);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (!searchMatches.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        searchActiveIndex = (searchActiveIndex + 1) % searchMatches.length;
        updateSearchActive();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        searchActiveIndex = (searchActiveIndex - 1 + searchMatches.length) % searchMatches.length;
        updateSearchActive();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (searchActiveIndex >= 0) selectSearchResult(searchMatches[searchActiveIndex]);
      } else if (e.key === "Escape") {
        searchResults.style.display = "none";
        searchMatches = [];
      }
    });

    document.addEventListener("click", (e) => {
      if (!document.getElementById("search-box").contains(e.target)) {
        searchResults.style.display = "none";
      }
    });
  </script>
</body>
</html>
