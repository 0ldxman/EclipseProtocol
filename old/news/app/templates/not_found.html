{% extends "feed_base.html" %}
{% block title %}Новость не найдена — {{ app_title }}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__code">404</div>
  <h1 class="auth-card__title">Новость не найдена</h1>
  <p class="auth-card__sub">Возможно, она ещё не опубликована или была удалена.</p>
  <div class="auth-actions">
    <a class="discord-btn discord-btn--ghost" href="/">К ленте новостей</a>
  </div>
</div>
{% endblock %}
