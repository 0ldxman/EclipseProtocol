[project]
name = "aether-auth"
version = "0.1.0"
description = "Discord OAuth2 authorization microservice issuing RS256 JWTs for downstream services (Wiki, Command Center)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
